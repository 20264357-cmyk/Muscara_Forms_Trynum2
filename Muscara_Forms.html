<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muscara - Personal Information Form</title>
</head>
<body>

    <h1>Personal Information</h1>
    <hr>

    <form action="#" method="post">

        <fieldset>
            <legend>Basic Information</legend>
            <p>
                <label for="userFullname">Full Name:</label>
                <input type="text" id="userFullname" name="userFullname">
            </p>
            <p>
                <label for="userEmail">Email Address:</label>
                <input type="email" id="userEmail" name="userEmail">
            </p>
        </fieldset>
     
        <fieldset>
            <legend>Gender</legend>
            <p>
                <input type="radio" id="lalaki" name="Gender" value="lalaki">
                <label for="lalaki">Lalaki</label>
        
                <input type="radio" id="babae" name="Gender" value="babae">
                <label for="babae">Babae</label>
        s
                <input type="radio" id="OtherGender" name="Others" value="Others">
                <label for="Others">Other Genders</label>
            </p>
        </fieldset>
       

        <fieldset>
            <legend>Hobbies and Interests</legend>
            <p>
                <input type="checkbox" id="hobbyTraining" name="Training" value="Training">
                <label for="Training">Training</label>
                <br>

                <input type="checkbox" id="hobbyTravel" name="Travel" value="Traveling">
                <label for="Travel">Traveling</label>
                <br>

                <input type="checkbox" id="Gaming" name="Gaming" value="Gaming">
                <label for="Gaming">Gaming</label>
                <br>

                <input type="checkbox" id="Sports" name="Sports" value="Combative Sports">
                <label for="Sports">Combative Sports</label>
                <br>

                <input type="checkbox" id="singing" name="singing" value="Singing">
                <label for="singing">Singing</label>
                <br>
        
                <input type="checkbox" id="dancing" name="dancing" value="Dancing">
                <label for="dancing">Dancing</label>
                <br>
        
                <input type="checkbox" id="photography" name="photography" value="Photography">
                <label for="photography">Photography</label>
                <br>
        
                <input type="checkbox" id="cycling" name="cycling" value="Cycling">
                <label for="cycling">Cycling</label>
                <br>
        
                <input type="checkbox" id="listeningMusic" name="listeningMusic" value="Listening to Music">
                <label for="listeningMusic">Listening to Music</label>
                <br>
    
                <input type="checkbox" id="gardening" name="gardening" value="Gardening">
                <label for="gardening">Gardening</label>
                <br>
        
                <input type="checkbox" id="jogging" name="jogging" value="Jogging">
                <label for="jogging">Jogging</label>
        
            </p>
        </fieldset>

        <fieldset>
            <legend>Your Feedback</legend>
            <p>
                <label for="userComments">Comments:</label>
                <br>
                <textarea id="userComments" name="userComments" rows="5" cols="35"></textarea>
            </p>
        </fieldset>

        <p>
            <button type="submit">Submit Form</button>
        </p>

    </form>

</body>
</html>
